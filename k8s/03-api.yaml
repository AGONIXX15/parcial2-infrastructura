apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: parcial2-app
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: parcial2-api:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: DB_HOST, value: db.parcial2-app.svc.cluster.local}
          envFrom:
            - secretRef: {name: db-credentials}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: parcial2-app
spec:
  type: LoadBalancer
  selector: {app: api}
  ports: [{port: 80, targetPort: 8000}]
