apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: parcial2-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          envFrom:
            - secretRef: {name: db-credentials}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "appuser", "-d", "appdb"]}
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: parcial2-app
spec:
  selector: {app: db}
  ports: [{port: 5432, targetPort: 5432}]
