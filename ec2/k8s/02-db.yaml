# Extra: PVC real en lugar de emptyDir. El dato sobrevive al borrado del Pod de la DB.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: parcial2-app
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi        # StorageClass "standard" de Minikube lo aprovisiona solo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: parcial2-app
spec:
  replicas: 1
  strategy:
    type: Recreate        # RWO: el Pod viejo debe soltar el volumen antes del nuevo
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          envFrom:
            - secretRef: {name: db-credentials}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}   # evita el lost+found de la raiz del volumen
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "appuser", "-d", "appdb"]}
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: db-data}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: parcial2-app
spec:
  selector: {app: db}
  ports: [{port: 5432, targetPort: 5432}]
